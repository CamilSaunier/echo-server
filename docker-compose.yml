services:
  # Service de base de données PostgreSQL
  echo-db:
    image: postgres:17-alpine
    container_name: echo-db
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Service Backend Node.js / Express
  echo-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: echo-server
    # <-- C'EST ICI QUE ÇA CHANGE
    # Avant de lancer "pnpm dev", on réinstalle les dépendances.
    # Ça garantit que le node_modules du volume est toujours synchro
    # avec ton package.json, même si le volume est "périmé".
    command: sh -c "pnpm install && pnpm dev"
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    volumes:
      - .:/app
      - pnpm_modules:/app/node_modules
    environment:
      - PORT=${PORT}
      - NODE_ENV=${NODE_ENV}
      - DATABASE_URL=${DATABASE_URL}
      - CI=true
    depends_on:
      - echo-db

volumes:
  postgres_data:
  pnpm_modules:
